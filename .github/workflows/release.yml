name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run 'make fmt'"; exit 1; }
          go vet ./...
          go test ./...
          # the service is highly concurrent (probe loops, proxy pool, stats
          # writer, dashboard pollers) — keep the race detector in the loop
          go test -race ./...

      - name: Build (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${GITHUB_REF_NAME#v} -X zen-gate-server/internal/server.Version=${GITHUB_REF_NAME#v}" \
            -o dist/zen-gate-server-linux-amd64 ./cmd/zen-gate-server

      - name: Build (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${GITHUB_REF_NAME#v} -X zen-gate-server/internal/server.Version=${GITHUB_REF_NAME#v}" \
            -o dist/zen-gate-server-linux-arm64 ./cmd/zen-gate-server

      - name: Checksums
        run: cd dist && sha256sum zen-gate-server-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/zen-gate-server-linux-amd64
            dist/zen-gate-server-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
